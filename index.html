<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ekskul Komputer Cikpus</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Kustom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

  <!-- TOP HEADER -->
  <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 sticky top-0 z-40 no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-indigo-600 rounded-lg shadow-lg">
          <i class="fa-solid fa-laptop-code text-xl text-white"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Ekskul Komputer OS</h1>
          <p class="text-xs text-slate-400">Sistem Pembagian Proyek & Game Logika CT</p>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="flex bg-slate-900/60 p-1 rounded-xl border border-slate-700/60">
        <button id="tab-btn-projects" onclick="switchTab('projects')" class="px-4 py-1.5 rounded-lg text-sm font-medium transition-all bg-indigo-600 text-white shadow">
          <i class="fa-solid fa-diagram-project mr-1.5"></i>Proyek
        </button>
        <button id="tab-btn-game" onclick="switchTab('game')" class="px-4 py-1.5 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-slate-200">
          <i class="fa-solid fa-gamepad mr-1.5"></i>Tes Logika CT
        </button>
        <button id="tab-btn-leaderboard" onclick="switchTab('leaderboard')" class="px-4 py-1.5 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-slate-200">
          <i class="fa-solid fa-trophy mr-1.5"></i>Peringkat
        </button>
      </nav>

      <!-- Role Status & Admin Auth -->
      <div class="flex items-center space-x-3">
        <span id="role-badge" class="px-2.5 py-1 rounded-md text-xs font-bold bg-slate-700 text-slate-300">
          Role: Guest
        </span>

        <button id="auth-btn" onclick="openAuthModal()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-xs rounded-lg font-medium transition flex items-center gap-1.5 text-white">
          <i class="fa-solid fa-key"></i> Login Admin
        </button>

        <!-- Dynamic Admin Action Controls -->
        <div class="admin-only hidden items-center space-x-2">
          <button onclick="exportJSON()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs rounded-lg font-medium transition flex items-center gap-1.5">
            <i class="fa-solid fa-download"></i> Export JSON
          </button>
          <label class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs rounded-lg font-medium transition flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-upload"></i> Import JSON
            <input type="file" id="json-input" class="hidden" accept=".json" onchange="importJSON(event)">
          </label>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Status bar, Form, Cards, Table, Game, & Leaderboard UI -->
    <!-- (Tampilan antarmuka utama) -->
  </main>

  <!-- MODAL AUTHENTICATION -->
  <div id="auth-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
      <div class="flex justify-between items-center">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-shield-halved text-indigo-400"></i> Autentikasi Role
        </h3>
        <button onclick="closeAuthModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="space-y-3">
        <label class="block text-xs text-slate-300">Pilih Mode Akses:</label>
        <select id="role-select" onchange="togglePinInput()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
          <option value="guest">Guest (Tamu - Hanya Melihat)</option>
          <option value="member">Member (Siswa - Daftar & Main Game)</option>
          <option value="admin">Administrator (Akses Penuh)</option>
        </select>

        <div id="pin-container" class="hidden space-y-1">
          <label class="block text-xs text-slate-300">Masukkan PIN Admin:</label>
          <input type="password" id="admin-pin-input" placeholder="Masukkan PIN (default: 1234)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
      </div>

      <button onclick="applyRoleSelection()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-sm font-medium transition">
        Konfirmasi Akses
      </button>
    </div>
  </div>

  <!-- FIREBASE & SCRIPT MODULES -->
  <script type="module" src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/game.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
